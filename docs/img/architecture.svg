<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 320" width="1240" height="320" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">SkyFlow local-only demo: horizontal architecture</title>
  <desc id="d">Left to right on one local machine: React UI, coded rule-based advisor, deterministic engine, human approval and browser storage. Bundled seed and customer data feed the engine. No LLM, backend, Azure or external notifications.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:1.5}
      .h{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#334155}
      .edge{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1240" height="320" fill="#fff"/>
  <text x="24" y="32" font-size="21" font-weight="700" fill="#0f172a">SkyFlow: local-only, rule-based demo</text>
  <rect x="16" y="52" width="1208" height="220" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="32" y="76" class="s">ONE LOCAL MACHINE / LOCALHOST ASSET SERVER / ALL APPLICATION LOGIC IN THE BROWSER</text>
  <rect class="box" x="36" y="100" width="208" height="95" rx="8"/>
  <text class="h" x="140" y="128" text-anchor="middle">React UI</text>
  <text class="s" x="140" y="151" text-anchor="middle">2D / 3D / dashboards</text>
  <text class="s" x="140" y="173" text-anchor="middle">role lenses / GPS replay</text>
  <rect class="box" x="276" y="100" width="208" height="95" rx="8"/>
  <text class="h" x="380" y="128" text-anchor="middle">Coded advisor</text>
  <text class="s" x="380" y="151" text-anchor="middle">Detect / Triage / Resolve</text>
  <text class="s" x="380" y="173" text-anchor="middle">Comms: local preview only</text>
  <rect class="box" x="516" y="100" width="208" height="95" rx="8"/>
  <text class="h" x="620" y="128" text-anchor="middle">Deterministic engine</text>
  <text class="s" x="620" y="151" text-anchor="middle">simulation / scoring / value</text>
  <text class="s" x="620" y="173" text-anchor="middle">planning / optimization</text>
  <rect class="box" x="756" y="100" width="208" height="95" rx="8"/>
  <text class="h" x="860" y="128" text-anchor="middle">Human approval</text>
  <text class="s" x="860" y="151" text-anchor="middle">manager confirms proposal</text>
  <text class="s" x="860" y="173" text-anchor="middle">overlays / owned 5W2H tasks</text>
  <rect class="box" x="996" y="100" width="208" height="95" rx="8"/>
  <text class="h" x="1100" y="128" text-anchor="middle">Browser storage</text>
  <text class="s" x="1100" y="151" text-anchor="middle">IndexedDB: decisions / audit</text>
  <text class="s" x="1100" y="173" text-anchor="middle">localStorage: preferences</text>
  <path class="edge" d="M244 148H276"/>
  <path class="edge" d="M484 148H516"/>
  <path class="edge" d="M724 148H756"/>
  <path class="edge" d="M964 148H996"/>
  <rect class="box" x="456" y="220" width="328" height="32" rx="6"/>
  <text class="s" x="620" y="241" text-anchor="middle">Bundled customer.json + deterministic seed data</text>
  <path class="edge" d="M620 220V195"/>
  <text x="24" y="300" class="s">No LLM / no Azure / no API or MCP server / no external notifications. Baseline is immutable; all outcomes are simulated.</text>
</svg>
