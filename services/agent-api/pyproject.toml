[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "skyflow-agent-api"
version = "0.1.0"
description = "Multi-agent (Detect -> Triage -> Resolver -> Comms) proposal API over the deterministic SkyFlow engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "opentelemetry-api>=1.27",
]

[project.optional-dependencies]
# Azure / agent runtime. Imported lazily, so unit tests and rules mode do not need them.
azure = [
  "agent-framework-core>=1.22",
  "agent-framework-foundry>=1.15",
  "mcp>=1.9",
  "azure-identity>=1.19",
  "azure-cosmos>=4.9",
  "azure-monitor-opentelemetry>=1.6",
  "PyJWT[crypto]>=2.9",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "PyJWT>=2.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
