# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: skyflow-ai
services:
  web:
    project: ./app
    language: js
    host: staticwebapp
    dist: dist
  engine-mcp:
    project: ./services/engine-mcp
    language: ts
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ../..
      remoteBuild: true
  agent-api:
    project: ./services/agent-api
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ../..
      remoteBuild: true
  scheduler:
    project: ./services/agent-api
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ../..
      remoteBuild: true
