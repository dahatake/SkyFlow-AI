name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (use a previous good SHA to roll back)
        required: false
        default: main

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  staging:
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: staging
      ref: ${{ inputs.ref || github.sha }}
    secrets: inherit

  production:
    needs: staging
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      ref: ${{ inputs.ref || github.sha }}
    secrets: inherit
