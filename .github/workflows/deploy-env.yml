name: Deploy environment

on:
  workflow_call:
    inputs:
      environment: { required: true, type: string }
      ref: { required: true, type: string }

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ false }} # Archived: prevent reusable workflow calls from recreating Azure resources.
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      BUDGET_CONTACT_EMAIL: ${{ vars.BUDGET_CONTACT_EMAIL }}
      ENVIRONMENT_TYPE: ${{ inputs.environment == 'production' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Azure/setup-azd@v2
      - name: Test
        working-directory: app
        run: |
          npm ci
          npm test
      - name: Log in with azd (federated credential)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider github \
            --tenant-id "$AZURE_TENANT_ID"
      - name: Select environment
        run: |
          azd env new "$AZURE_ENV_NAME" --no-prompt || azd env select "$AZURE_ENV_NAME"
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set ENVIRONMENT_TYPE "$ENVIRONMENT_TYPE"
      - name: Provision infrastructure
        run: azd provision --no-prompt
      - name: Deploy application
        run: azd deploy --no-prompt
      - name: Smoke test
        run: |
          eval "$(azd env get-values | sed 's/^/export /')"
          curl --fail --retry 10 --retry-delay 15 --retry-all-errors "${WEB_URI%/}/api/health"
          curl --fail --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null -s -w '%{http_code}\n' "$WEB_URI" || true
      - name: Browser smoke test
        if: ${{ vars.E2E_PUBLIC == 'true' }}
        working-directory: app
        run: |
          eval "$(azd env get-values | sed 's/^/export /')"
          npx playwright install --with-deps chromium
          E2E_BASE_URL="$WEB_URI" npm run test:e2e
